repository:
  description: Official portable AI-agent skills for the NumiTracker precious-metals MCP server.
  homepage: https://numitracker.com/integracje-ai
  topics: numitracker, mcp, agent-skills, precious-metals, bullion, poland, claude-code, cursor, codex
  has_issues: true
  has_projects: false
  has_wiki: false
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  delete_branch_on_merge: true

branches:
  - name: main
    protection:
      enforce_admins: true
      required_status_checks:
        strict: true
        contexts:
          - Validate skills
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
      restrictions: null
